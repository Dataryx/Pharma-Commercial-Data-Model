name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Generate demo
        run: python -m pcdm generate --scale demo --seed 42
      - name: Pytest
        run: python -m pytest tests -q
      - name: Load + dbt
        env:
          PCDM_DUCKDB_PATH: ${{ github.workspace }}/warehouse/pcdm.duckdb
        run: |
          python -m pcdm init-db
          python -m pcdm load --scale demo
          cd dbt
          dbt deps --profiles-dir profiles
          dbt build --profiles-dir profiles --target duckdb
      - name: Docs artifacts
        run: python -m pcdm docs-generate
