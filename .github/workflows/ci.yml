name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Generate demo
        run: python -m pcdm generate --scale demo --seed 42
      - name: Pytest (unit)
        run: python -m pytest tests -q --ignore=tests/test_generator.py -k "not determinism"
      - name: Generator + EDI + MDM tests
        run: python -m pytest tests/test_generator.py -q
      - name: Load + dbt
        run: |
          python -m pcdm init-db
          python -m pcdm load --scale demo
          cd transform
          dbt deps --profiles-dir profiles
          dbt build --profiles-dir profiles --target duckdb
      - name: Docs artifacts
        run: python -m pcdm docs-generate
