[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdm"
version = "0.1.0"
description = "Pharma Commercial Data Model — synthetic reference warehouse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PCDM Reference" }]
dependencies = [
  "numpy>=2.1.0",
  "polars>=1.17.0",
  "pandas>=2.2.0",
  "faker>=33.0.0",
  "duckdb>=1.1.0",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
  "python-dateutil>=2.9",
  "jellyfish>=1.1",
  "networkx>=3.2",
  "matplotlib>=3.9",
  "dbt-core>=1.8.0,<1.9",
  "dbt-duckdb>=1.8.0,<1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "black>=24.0",
  "pre-commit>=4.0",
  "mkdocs-material>=9.5",
  "streamlit>=1.40",
]
orch = [
  "dagster>=1.9",
  "dagster-dbt>=0.25",
  "dagster-webserver>=1.9",
]
lint = [
  "sqlfluff>=3.2",
  "sqlfluff-templater-dbt>=3.2",
]

[project.scripts]
pcdm = "pcdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "orchestration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
